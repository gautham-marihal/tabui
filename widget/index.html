<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Try the bank assistant</title>

    <style>
      :root {
        --background: #f7f5fa;
        --foreground: #171717;

        --tetherfi-brand-color: #732b90;
      }

      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      html,
      body {
        max-width: 100vw;
        overflow-x: hidden;
      }

      body {
        color: var(--foreground);
        background: var(--background);
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      a {
        color: teal;
        text-decoration: none;
      }

      section {
        max-width: 1280px;
        margin: 0 auto;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #120e17;
        }
      }

      #tabui-development-app-root {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- the guide to trying the bank assistant (src/guide); the widget opens over it, bottom right -->
    <main id="tabui-guide-root"></main>
    <section>
      <div id="tabui-development-app-root"></div>
    </section>

    <script type="module" src="/src/main.tsx"></script>
    <!-- its own entry, so the widget bundle (vite build: src/main.tsx) never carries the guide -->
    <script type="module" src="/src/guide/main.tsx"></script>
  </body>
</html>
